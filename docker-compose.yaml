version: '3'

services:
  db:
    image: postgres:14.3
    restart: always
    container_name: teslo-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: $(DB_USERNAME)
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data
